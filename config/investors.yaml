# 13F を集計する運用者の名簿（tools/fetch_13f.py が読む）。
#
#   name  : EDGAR の会社名検索に使う名前。ヒットしない場合は cik を直接書く
#   style : screen_candidates.py の --styles で絞り込むための分類
#           value / quality / growth / activist / macro / quant / concentrated
#   cik   : 任意。書くと名前解決を飛ばす（10 桁でなくてよい）
#
# 名簿は「今有名な人」で作られており、同じ手法で失敗した運用会社は入っていない
# （生存者バイアス）。フォークして自分の名簿に育てること。
# 名前が解決できない場合は fetch_13f.py が最後に「未解決」として一覧する。

investors:
