# 戦略定義
#
# 1 銘柄の state に対して「全戦略の questions」をまとめて 1 リクエストで評価する。
# Jev は state のトークン代を questions 間で共有するので、戦略を増やしても
# コストはほぼ 1 回分のまま増えない。ここが Jev を戦略比較に使う理由。
#
# Jev が返すのは判断だけ。目標ウェイト・約定・損切り・現金下限は Python 側で決める。

portfolio:
  initial_cash: 10_000_000      # 円建て想定（USD 銘柄は fx で換算）
  base_currency: JPY
  fee_bps: 10                   # 片道手数料 0.10%
  slippage_bps: 5               # 片道スリッページ 0.05%
  cash_floor_pct: 5.0           # 現金比率の下限。戦略が何を言っても割らない
  max_gross_exposure_pct: 100.0 # レバレッジなし
  allow_short: false            # ショートは既定で無効

# 学習データリーク対策。true なら state から銘柄名・実日付を落とし、
# 匿名ラベルと相対値だけを Jev に渡す。
# バックテスト期間が Jev の学習データに含まれる場合、銘柄名を渡すと
# 「その後どうなったか」を知っている可能性があり、成績が過大評価される。
anonymize: true

universe:
  - symbol: MU
    label: INSTRUMENT_A
    asset_class: equity
    currency: USD
  - symbol: 7203.T
    label: INSTRUMENT_B
    asset_class: equity
    currency: JPY
  - symbol: 1306.T
    label: INSTRUMENT_C
    asset_class: equity_etf
    currency: JPY
  - symbol: VT
    label: INSTRUMENT_D
    asset_class: equity_etf
    currency: USD

# しきい値。Jev の confidence / noul をどう扱うか。
# confidence は品質指標ではなく「振り分け信号」として使う。
routing:
  auto_min_confidence: 0.75     # これ以上は自動執行
  review_min_confidence: 0.50   # ここから上はレビュー待ち、下は何もしない

strategies:

  trend_follow:
    description: 中期トレンドフォロー。上昇トレンドに乗り、崩れたら降りる。
    max_weight_pct: 30.0
    sizing: conviction_weighted
    questions:
      direction:
        type: choice
        instructions: >
          あなたは中期トレンドフォロー戦略のトレーダーです。
          与えられた観測値だけを根拠に、この銘柄に対して今取るべきポジションを 1 つ選んでください。
          移動平均との乖離、複数期間のリターン、トレンドの傾きを重視し、
          短期のノイズや日々の変動に過剰反応しないこと。
        criteria:
          long: >
            中期の上昇トレンドが成立しており、価格が主要移動平均の上にあり、
            高値からの押しも浅い。新規または継続の買い持ちが妥当。
          flat: >
            トレンドが不明瞭、移動平均が収束している、またはトレンドが崩れかけており、
            方向性に賭けるべきでない。現金で待つのが妥当。
          short: >
            中期の下降トレンドが明確に成立しており、価格が主要移動平均を下回り、
            戻りも弱い。売り持ちが妥当。
      trend_intact:
        type: noul
        instructions: >
          この銘柄の中期上昇トレンドは、現時点でまだ崩れていないと言えますか。
          押し目の深さとトレンドの傾きを重視してください。
        criteria:
          "true": 上昇トレンドは維持されており、現在の下落は一時的な押し目の範囲に収まっている。
          "false": 上昇トレンドは崩れた、または元から上昇トレンドではない。
      conviction:
        type: score
        instructions: >
          このトレンドフォローのエントリー機会としての魅力度を評価してください。
          トレンドの明確さと、現在価格のエントリー位置としての有利さの両方を見ること。
        criteria:
          - トレンドが存在しない、または逆行しており、エントリーすべきでない。
          - トレンドは弱く、エントリーするなら最小サイズに留めるべき。
          - トレンドは明確だが、エントリー位置としては割高または出遅れ。
          - トレンドが明確で、エントリー位置も妥当。標準サイズが妥当。
          - トレンドが明確かつ押し目からの再開局面で、エントリー位置も有利。大きめのサイズが妥当。

  mean_revert:
    description: 短期平均回帰。売られ過ぎを拾い、平均に戻ったら降りる。
    max_weight_pct: 20.0
    sizing: conviction_weighted
    questions:
      direction:
        type: choice
        instructions: >
          あなたは短期平均回帰戦略のトレーダーです。
          この銘柄が短期的に行き過ぎており、平均へ戻る動きが期待できるかを判断してください。
          重要: 下降トレンドの最中の売られ過ぎは「落ちるナイフ」であり、
          平均回帰の対象ではありません。中期トレンドが崩れていない銘柄の
          一時的な売られ過ぎのみを対象とすること。
        criteria:
          long: >
            中期トレンドは維持されている一方で短期的に売られ過ぎており、
            平均への戻りが期待できる。買いが妥当。
          flat: >
            行き過ぎていない、または中期トレンド自体が崩れているため
            平均回帰の前提が成り立たない。何もしない。
          short: >
            中期トレンドが崩れていない中で短期的に買われ過ぎており、
            平均への戻り（下落）が期待できる。売りが妥当。
      not_falling_knife:
        type: noul
        instructions: >
          この売られ過ぎは「一時的な押し目」であり、
          「トレンド崩壊の初期段階（落ちるナイフ）」ではないと言えますか。
        criteria:
          "true": 中期の構造は維持されており、短期的な行き過ぎとして扱って良い。
          "false": トレンド自体が壊れている可能性が高く、逆張りは危険。
      conviction:
        type: score
        instructions: >
          この平均回帰トレードの機会としての魅力度を評価してください。
          行き過ぎの度合いと、中期構造の健全さの両方を見ること。
        criteria:
          - 行き過ぎがない、またはトレンド崩壊中で、手を出すべきでない。
          - わずかな行き過ぎ。最小サイズに留めるべき。
          - 明確な行き過ぎだが、中期構造にやや不安がある。
          - 明確な行き過ぎで中期構造も健全。標準サイズが妥当。
          - 極端な行き過ぎかつ中期構造は堅牢。大きめのサイズが妥当。

  risk_guard:
    description: >
      リスク回避判断。個別の売買ではなく、ポートフォリオ全体の
      エクスポージャーを絞るべき局面かを判断する。
    max_weight_pct: 0.0           # 自身はポジションを取らない
    sizing: risk_overlay
    questions:
      derisk_now:
        type: noul
        instructions: >
          現在の市場環境は、ポートフォリオ全体のリスクを能動的に下げるべき局面ですか。
          ボラティリティの水準とその変化、高値からの下落幅、
          複数期間のリターンの整合性を重視してください。
        criteria:
          "true": ボラティリティが上昇しドローダウンが深まる、リスク縮小が妥当な局面。
          "false": 通常の市場環境で、特別なリスク縮小は不要。
      stress_level:
        type: score
        instructions: >
          現在の市場ストレスの水準を評価してください。
          ボラティリティの絶対水準ではなく、直近 1 年の分布の中での位置と、
          その変化の速さを重視すること。
        criteria:
          - 平穏。ボラティリティは低位安定、ドローダウンも浅い。
          - やや不安定だが通常の範囲内。
          - 明確にボラティリティが上昇しており、警戒が必要。
          - 高ストレス。ボラティリティが高位でドローダウンも深い。
          - 極度のストレス。急激なボラティリティ拡大と大幅な下落が同時進行。
