# Claude の裁量口座の判断。新しい判断は末尾に追記する（過去の判断は書き換えない）。
#
#   date:      判断に使った最後の終値の日。約定はこの日より後の最初の終値。
#   weights:   目標ウェイト（0〜1、合計 1 以下。残りは現金）。使える銘柄は src/sim.py の UNIVERSE。
#   rationale: 判断の理由。結果を見たあとで理由を書き換えない。
#   summary_zh: 理由の中国語の要約（ページに出す。ユーザーが読む言語）。
#
# 実際の発注はしない。結果は paper/REPORT.md。

decisions:
  - date: 2026-10-09
    weights: {VT: 0.50, QQQ: 0.15, 1348.T: 0.15, BIL: 0.15}
    summary_zh: |
      判断：一半照基准买全球股；稍微多配最近走强的美国科技股（纳指 100）和日本股；
      正在下跌的债券和黄金不买，改持美国短期国债和现金，作为下跌时的缓冲和日元升值时的备用资金。
      日本股是日元资产，也能部分抵消日元升值（现在 1 美元约 158 日元）的影响。
      预计和基准的差在 ±2% 以内；股票只占 80%，上涨行情里容易输给基准，下跌或日元升值时才可能赢。
    rationale: |
      見えている材料（2026-10-09 の終値まで）:
      株は世界・米国・日本とも 200 日線の上で、高値から 2% 以内。日本株（1348.T）は 12 か月 +34% と最も強い。
      債券（AGG）は 200 日線の下で 12 か月マイナス、金（GLD）は高値から -22% で下降トレンド。
      ドル円は 158 円台で、1 年の高値圏。

      判断:
      - 土台は全世界株 50%。1 か月で勝ち負けを当てる根拠は無いので、半分は基準と同じにする。
      - 強い市場に少し寄せる（米国大型グロース QQQ 15%、日本株 15%）。モメンタムは
        研究で一番しぶとく残っている傾向で、1 か月の勝負で唯一根拠と呼べるもの。
      - 下降トレンドの債券と金は持たない。代わりに短期国債（BIL）15%、現金 5%。
        下落時のクッションと、円高に振れたときの買い余力にする。
      - 日本株 15% は円建てなので、158 円からの円高（ドル建て資産の目減り）への部分的な備えにもなる。

      予想: 基準（全世界株 1 本）との差は ±2% 以内に収まる可能性が高い。
      株を 80% しか持たないので、上昇相場では基準に負けやすい。勝てるのは下落か円高の月。
