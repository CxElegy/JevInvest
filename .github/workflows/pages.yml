# web/ledger.html を GitHub Pages（https://cxelegy.github.io/JevInvest/）に公開する。
# 公開範囲はインターネット全体（URL を知っていれば誰でも見られる）。公開するファイルは
# tools/build_site.py の許可リストだけ。seed.json などの個人のデータは入れない。
# 初回だけ Settings → Pages → Build and deployment → Source を「GitHub Actions」にする。
name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# 既定は読むだけ。公開の権限は deploy のジョブだけに渡す（build はリポジトリの Python を動かすため）
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # --strict: 許可リストの JSON が 1 つでも無ければ止める（公開先でタブが読み込みエラーになるため）。
      # 公開してはいけない文面（年齢・勤務先の仕組みの名前など）があっても止まる
      - name: サイトを組み立てる（許可リストのファイルだけ）
        run: python tools/build_site.py --out _site --strict

      - name: 公開物に個人の明細が無いことを確かめる
        run: |
          ls -la _site
          if find _site -iname 'seed*.json' | grep -q .; then
            echo "seed.json が公開物に入っています。公開しません" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
